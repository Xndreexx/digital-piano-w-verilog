# Tiny Tapeout project information
project:
  title:        "Digital Piano Verilog"
  author:       "Ruiz-Dafne, Peña-Andrea, Mendez-Sebastian"
  discord:      ""
  description:  "3-voice polyphonic digital keyboard with 4 selectable timbres and 4 octaves"
  language:     "Verilog"
  clock_hz:     10000000

  # How many tiles your design occupies? A single tile is about 340x160 uM.
  tiles: "1x1"

  # Your top module name must start with "tt_um_". Make it unique by including your github username:
  top_module:  "tt_um_uabc_piano"

  # List your project's source files here.
  source_files:
      - "project.v"

# The pinout of your project. Leave unused pins blank. DO NOT delete or add any pins.
pinout:
  # Inputs
  ui[0]: "KEY_C (Do)"
  ui[1]: "KEY_D (Re)"
  ui[2]: "KEY_E (Mi)"
  ui[3]: "KEY_F (Fa)"
  ui[4]: "KEY_G (Sol)"
  ui[5]: "KEY_A (La)"
  ui[6]: "KEY_B (Si)"
  ui[7]: "TIMBRE_0"

  # Outputs
  uo[0]: "AUDIO_OUT (Sigma-Delta)"
  uo[1]: "SEG_A"
  uo[2]: "SEG_B"
  uo[3]: "SEG_C"
  uo[4]: "SEG_D"
  uo[5]: "SEG_E"
  uo[6]: "SEG_F"
  uo[7]: "SEG_G"

  # Bidirectional pins
  uio[0]: "KEY_CS (Do#)"
  uio[1]: "KEY_DS (Re#)"
  uio[2]: "KEY_FS (Fa#)"
  uio[3]: "KEY_GS (Sol#)"
  uio[4]: "KEY_AS (La#)"
  uio[5]: "OCTAVE_0"
  uio[6]: "OCTAVE_1"
  uio[7]: "TIMBRE_1"

# Do not change!
yaml_version: 6
